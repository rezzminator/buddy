<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#10141b"/>
  <rect x="0" y="600" width="1280" height="40" fill="#1a202b"/>
  <g font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace">
    <rect x="64" y="96" width="600" height="84" rx="22" fill="none" stroke="#e8e8e8" stroke-width="3"/>
    <text x="96" y="150" font-size="27" fill="#f5f5f5">QUACK! All green, like pond weed.</text>
    <path d="M170 180 L190 214 L214 180" fill="#10141b" stroke="#e8e8e8" stroke-width="3" stroke-linejoin="round"/>
    <rect x="160" y="178" width="60" height="4" fill="#10141b"/>
    <text font-size="76" fill="#ffffff" xml:space="preserve">
      <tspan x="64" y="310"> *  .-.    </tspan>
      <tspan x="64" y="398">\__( x)=   </tspan>
      <tspan x="64" y="486"> \_\/_)    </tspan>
      <tspan x="64" y="574">  L  L     </tspan>
    </text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="660" y="250" font-size="112" font-weight="700" fill="#ffffff">buddy</text>
    <text font-size="30" fill="#d7dce4">
      <tspan x="664" y="318">Claude Code buddy plugin: Quack the</tspan>
      <tspan x="664" y="360">ASCII duck waddles above your prompt</tspan>
      <tspan x="664" y="402">and talks back — or bring back your /buddy</tspan>
    </text>
    <text font-size="24" fill="#9aa3b2"><tspan x="664" y="468">Also ships Professor, robot, ghost,</tspan><tspan x="664" y="502">dragon, yellow duck, or draw your own.</tspan></text>
    <text x="64" y="628" font-size="22" fill="#9aa3b2">github.com/rezzminator/buddy</text>
    <text x="1216" y="628" font-size="22" fill="#D97757" text-anchor="end">Claude Code plugin · MIT</text>
  </g>
</svg>
