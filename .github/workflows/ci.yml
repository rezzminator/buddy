name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # The Claude Code the README says buddy is tested on; function hooks are early
  # access, so CI runs that engine and a bump is deliberate.
  # scripts/release-check.sh fails when this and the README's "tested on" differ.
  CLAUDE_CODE_VERSION: "2.1.286"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: npm test
      - run: npm run typecheck
      - run: npm run validate:plugin

  release:
    name: release
    # main is release-only, and installs track main: a pull request into main,
    # and every push that lands on it, must move the version past main's
    # previous one and carry its dated CHANGELOG section.
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: main's previous version
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: git show "$BASE:plugins/buddy/.claude-plugin/plugin.json" > /tmp/main-plugin.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/main-plugin.json
      - run: scripts/release-check.sh "$(node -p 'require("/tmp/main-plugin.json").version')"
